services:
  api:
    build: .
    container_name: dialect-labeler-dispatcher
    restart: unless-stopped
    ports:
      # Loopback-only. The public port is 8080 on the HOST, served by
      # Caddy (or another reverse proxy) which terminates TLS and forwards
      # here on 127.0.0.1:9000. Direct exposure on 8080 would conflict
      # with the reverse-proxy and make the dispatcher reachable WITHOUT
      # the proxy's request_body / timeout / log policies.
      - "127.0.0.1:9000:8080"
    env_file:
      - .env
    volumes:
      # SQLite DB + STORAGE_DIR both live under /data inside the container.
      # On the host they show up as ./data and ./data/storage so backups
      # are just `tar czf backup.tgz ./data`.
      - ./data:/data
