name: Publish to Cloud Dispatcher

# Triggered when a `v*` tag is pushed. Builds the full Tauri client
# (cloud Worker mode enabled), signs the installer with the Tauri
# updater key, then POSTs both the .msi and the matching .sig to the
# configured dispatcher's /api/releases endpoint so existing clients
# pick up the new version on their next /api/updater poll.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          full text of `~/.tauri/<name>.key`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD passphrase chosen at key-gen time
#   DISPATCHER_URL                     e.g. https://dispatcher.example.com
#   DISPATCHER_TOKEN                   admin JWT (rotate periodically)
#
# Generate the key once with:
#   npx tauri signer generate -w ~/.tauri/dialect-labeler.key
# Then paste the public half into src-tauri/tauri.conf.json
# plugins.updater.pubkey, commit, and feed the private half into
# the GitHub secret as plain text.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: Build + sign + upload to dispatcher
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build full client (signed)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Locate built artifacts
        id: artifacts
        shell: pwsh
        run: |
          $msi = Get-ChildItem `
            -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" `
            | Select-Object -First 1
          if (-not $msi) { throw "no msi produced" }
          $sigPath = "$($msi.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "missing .sig — is TAURI_SIGNING_PRIVATE_KEY set?" }
          $version = "${{ github.ref_name }}".TrimStart('v')
          $signature = Get-Content $sigPath -Raw
          "msi_path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "signature<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $signature | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer to dispatcher
        shell: pwsh
        env:
          DISPATCHER_URL: ${{ secrets.DISPATCHER_URL }}
          DISPATCHER_TOKEN: ${{ secrets.DISPATCHER_TOKEN }}
        run: |
          if (-not $env:DISPATCHER_URL) { throw "DISPATCHER_URL secret is not set" }
          if (-not $env:DISPATCHER_TOKEN) { throw "DISPATCHER_TOKEN secret is not set" }
          $form = @{
            version   = "${{ steps.artifacts.outputs.version }}"
            target    = "windows-x86_64"
            channel   = "stable"
            signature = "${{ steps.artifacts.outputs.signature }}"
            notes     = "Tag ${{ github.ref_name }} (commit ${{ github.sha }})"
            file      = Get-Item "${{ steps.artifacts.outputs.msi_path }}"
          }
          $headers = @{ Authorization = "Bearer $env:DISPATCHER_TOKEN" }
          $resp = Invoke-RestMethod `
            -Uri "$env:DISPATCHER_URL/api/releases" `
            -Method Post -Headers $headers -Form $form
          Write-Host "uploaded release id=$($resp.id) version=$($resp.version)"

      - name: Attach to GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: '长沙方言标注 ${{ github.ref_name }}'
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
