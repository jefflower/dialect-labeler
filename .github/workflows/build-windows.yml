name: Build Windows Reviewer

# Builds a slimmed-down "审核版" Windows binary.
# - The Windows build hides Whisper / Ollama UI (VITE_REVIEW_ONLY=1 at
#   frontend build time) and ships only for QA folks who need to review
#   already-AI-processed annotations + export.
# - Builds are EXPENSIVE on CI (5-10 min, big binary). They are
#   triggered explicitly, NOT on every push to main:
#     · `v*` tag push        — official release; also mirrors to the
#                              dispatcher's /downloads page when
#                              DISPATCHER_URL/_TOKEN are set.
#     · workflow_dispatch    — manual "Run workflow" button on the
#                              Actions tab. Use this for snapshot
#                              builds when QA needs to test an
#                              in-flight branch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-reviewer:
    name: Build Windows reviewer (no models)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri reviewer bundle (Windows)
        env:
          VITE_REVIEW_ONLY: '1'
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dialect-labeler-reviewer-windows-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: '方言标注审核版 ${{ github.ref_name }}'
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      # On a tag push, ALSO mirror the installer into the dispatcher's
      # /downloads listing so end users have a single canonical place to
      # grab clients. Skipped when DISPATCHER_URL/_TOKEN are unset (e.g.
      # main-branch CI without the production secrets configured).
      - name: Mirror installer to dispatcher /downloads (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          DISPATCHER_URL: ${{ secrets.DISPATCHER_URL }}
          DISPATCHER_TOKEN: ${{ secrets.DISPATCHER_TOKEN }}
        run: |
          if (-not $env:DISPATCHER_URL -or -not $env:DISPATCHER_TOKEN) {
            Write-Host "DISPATCHER_URL or DISPATCHER_TOKEN not set; skipping mirror."
            exit 0
          }
          $msi = Get-ChildItem `
            -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" `
            | Select-Object -First 1
          if (-not $msi) { throw "no msi produced" }
          $version = "${{ github.ref_name }}".TrimStart('v')
          $form = @{
            version = $version
            target  = "windows-x86_64"
            channel = "stable"
            notes   = "Reviewer build · tag ${{ github.ref_name }} (commit ${{ github.sha }}) · no auto-update; users download manually."
            file    = Get-Item $msi.FullName
          }
          $headers = @{ Authorization = "Bearer $env:DISPATCHER_TOKEN" }
          $resp = Invoke-RestMethod `
            -Uri "$env:DISPATCHER_URL/api/releases" `
            -Method Post -Headers $headers -Form $form
          Write-Host "uploaded release id=$($resp.id) version=$($resp.version)"
